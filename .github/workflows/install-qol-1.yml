name: Instalar Lude QoL 1.0
on:
  push:
    paths:
      - .github/qol_upgrade_payload.txt
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche QoL validado
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, runpy
          from pathlib import Path
          encoded = Path('.github/qol_upgrade_payload.txt').read_text(encoding='ascii').strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '75403e958d6d7e5484b3dcdad7b45f994fa85a4201070e68421cc630c8dde1ea', 'Parche inesperado'
          Path('/tmp/lude_qol_upgrade.py').write_bytes(patch)
          runpy.run_path('/tmp/lude_qol_upgrade.py', run_name='__main__')
          PY
      - name: Verificar código y funciones QoL
        run: |
          python -m py_compile lude_economy.py
          python - <<'PY'
          import ast
          from pathlib import Path
          text = Path('lude_economy.py').read_text(encoding='utf-8')
          ast.parse(text)
          for token in ('class LudeNavigator(', 'class LudeAdminPanel(', 'class LudeAdminConfirmation(', 'economy_admin_audit', 'def build_portfolio_embed(', 'def build_market_embed(', 'def build_overview_embed(', '@lude.command(name="panel"', '@admin_group.command(name="historial"', 'ADMIN_OWNER_ID = 1006704642618568735'):
              assert token in text, token
          print('QoL 1.0: sintaxis y funciones comprobadas')
          PY
      - name: Publicar Cog en un único commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lude_economy.py
          git rm .github/qol_upgrade_payload.txt .github/workflows/install-qol-1.yml
          git commit -m 'Implementar QoL 1.0 con paneles, cartera, mercado y auditoría'
          git push