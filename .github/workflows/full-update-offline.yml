name: Lude full update offline checks
on:
  push:
    branches:
      - feature/lude-full-update-cents-savings
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discord.py test dependency
        run: python -m pip install 'discord.py>=2.3,<3'
      - name: Compile all modules
        run: python -m compileall -q lude scripts
      - name: Exact money and offline migration
        run: python -m scripts.test_money_v3
      - name: Full v3 integration (isolated SQLite)
        run: python -m scripts.test_full_v3_integration
      - name: Financial safety and guild registration
        run: python -m scripts.test_v3_safety
      - name: Offline release preparation and source immutability
        run: python -m scripts.test_full_v3_preparation
      - name: Full Market Engine 2.1 integration (isolated SQLite)
        run: python -m scripts.test_full_v3_market21
      - name: Market Engine 2.1 pure invariants
        run: python -m scripts.test_market_engine_21
