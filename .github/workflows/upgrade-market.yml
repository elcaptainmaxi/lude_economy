name: Instalar Lude Market Engine 2.0
on:
  push:
    paths:
      - .github/market_engine_trigger.txt
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar y aplicar parche sin restablecer la base de datos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          payload = Path('.github/market_engine_payload.txt').read_text(encoding='ascii').strip()
          source = lzma.decompress(base64.b64decode(payload, validate=True))
          expected = '3b59a4062b0dee303ec9048b724b560ef449fc301eecdb4dde854c2d6c5cb7d4'
          assert hashlib.sha256(source).hexdigest() == expected, 'Parche incompleto o alterado'
          patch = Path('/tmp/upgrade_lude_market.py')
          patch.write_bytes(source)
          code = compile(source, str(patch), 'exec')
          exec(code, {'__name__': '__main__', '__file__': str(patch)})
          PY
      - name: Validar sintaxis y simulaciones del motor
        shell: bash
        run: |
          python -m py_compile lude_economy.py
          python - <<'PY'
          import ast, math, random
          from pathlib import Path
          source = Path('lude_economy.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          defs = [node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'market_engine_step']
          assert len(defs) == 1
          ns = dict(math=math, random=random, CRYPTO_DYNAMIC_RATE=.002, CRYPTO_STABLE_BOOST=2.5, CRYPTO_FUNDAMENTAL_MAX_STEP=.008, CRYPTO_REGIME_SWITCH=.035, CRYPTO_GLOBAL_INFLUENCE=.12)
          exec(compile(ast.Module(body=defs, type_ignores=[]), '<engine>', 'exec'), ns)
          for name, seed, low, high, player, reversal, momentum, cap, liquidity in [('IC',1000,.01,.04,.02,.38,.30,.06,15000),('NVA',250,.03,.09,.04,.22,.40,.08,7500),('FLX',50,.07,.18,.06,.08,.55,.10,3000)]:
              cfg = dict(symbol=name,auto_min=low,auto_max=high,player_max=player,reversion_strength=reversal,momentum_strength=momentum,momentum_cap=cap,liquidity=liquidity)
              state = dict(fundamental=seed,regime='sideways',regime_ticks=0,volatility=.35,pressure=0,stable_ticks=0)
              price=seed; history=[price]; regimes=set(); rng=random.Random(seed)
              for i in range(1200):
                  price, state = ns['market_engine_step'](price,cfg,state,history[-13:],100 if i%5==0 else 0,60 if i%7==0 else 0,.15,rng=rng)
                  assert price > 0 and math.isfinite(price) and state['fundamental'] > 0 and math.isfinite(state['fundamental'])
                  assert 0 <= state['volatility'] <= 1 and -1 <= state['pressure'] <= 1
                  history.append(price); regimes.add(state['regime'])
              assert len(regimes)>=3, (name,regimes)
              print(name, '1200 ticks OK', 'regimes', sorted(regimes))
          for token in ('ADMIN_OWNER_ID = 1006704642618568735','1550285735305941022','1550285765584625845','Últimos 5:', 'crypto_engine_state'):
              assert token in source, token
          print('Sintaxis, IDs y simulaciones: OK')
          PY
      - name: Publicar Cog y retirar archivos transitorios
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lude_economy.py
          git rm .github/market_engine_payload.txt .github/market_engine_trigger.txt .github/workflows/upgrade-market.yml
          git commit -m 'Implementar motor cripto 2.0, historial de cinco movimientos y dueño único'
          git push