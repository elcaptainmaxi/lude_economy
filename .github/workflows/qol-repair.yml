name: Diagnosticar QoL
on:
  push:
    paths: ['.github/workflows/qol-repair.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar integridad del parche recuperado
        run: |
          python - <<'PY'
          import hashlib, subprocess
          s=subprocess.check_output(['git','show','956856de5a6c96d2e75a5d48a8cd4bf22f7e74ac:.github/qol_upgrade_payload.txt'], text=True).strip()
          for old,new in [('PhuH7iUo','PhuHj7iUo'),('BWrZ2dzJY0','BWrZ2dz3Y0')]:
              assert s.count(old)==1,(old,s.count(old))
              s=s.replace(old,new)
          expected={9000:'2cd84f836f2a9a8b',9200:'23481394cee89bf6',9400:'af4006e1a6216960',9600:'17bdd1359f113c3c',9800:'32abe94d53ededde',10000:'d7ade815699a4e0f',10200:'9105727811f759e3',10400:'7ba06e1baa4ffb6b',10600:'4192a9cbf2e37681',10700:'c15b29211108dc26',10736:'2423f95365ea4587'}
          print('Recovered length',len(s))
          for n,digest in expected.items():
              good=hashlib.sha256(s[:n].encode()).hexdigest()[:16]==digest
              print('PREFIX',n,'MATCH' if good else 'MISMATCH')
              if not good:
                  print('SUSPECT_SEGMENT',s[max(0,n-230):min(len(s),n+80)])
                  break
          PY