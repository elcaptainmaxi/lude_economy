name: Lude full update offline checks
on:
  push:
    branches:
      - feature/lude-full-update-cents-savings
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install discord.py for existing integration tests
        run: python -m pip install 'discord.py>=2.3,<3'
      - name: Compile source
        run: python -m compileall -q lude scripts/test_money_v3.py
      - name: Exact money and offline migration
        run: python -m scripts.test_money_v3
      - name: Existing market integration
        run: python -m scripts.test_crypto_21_real_cog
