name: Publicar Lude QoL 1.0
on:
  push:
    paths: ['.github/workflows/qol-repair.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recuperar y verificar parche antes de ejecutarlo
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, runpy, subprocess
          from pathlib import Path
          payload = subprocess.check_output(['git','show','956856de5a6c96d2e75a5d48a8cd4bf22f7e74ac:.github/qol_upgrade_payload.txt'], text=True).strip()
          corrections = [('PhuH7iUo','PhuHj7iUo'),('BWrZ2dzJY0','BWrZ2dz3Y0'),('SUfez7lxm5LkzQl1Cw','SUfez7lxmWk5LkzQl1Cw')]
          for old, new in corrections:
              assert payload.count(old) == 1, f'Corrección no única: {old}'
              payload = payload.replace(old,new,1)
          assert len(payload)==10736, 'Longitud incorrecta del paquete'
          assert hashlib.sha256(payload.encode()).hexdigest()=='2423f95365ea4587331506519fe021f0d2a37852dca1f56eba8d1209abe0cf5f', 'Paquete no coincide con el original'
          patch=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='75403e958d6d7e5484b3dcdad7b45f994fa85a4201070e68421cc630c8dde1ea', 'Parche inválido'
          Path('/tmp/lude_qol_upgrade.py').write_bytes(patch)
          runpy.run_path('/tmp/lude_qol_upgrade.py',run_name='__main__')
          PY
      - name: Comprobar sintaxis y siete funciones
        shell: bash
        run: |
          python -m py_compile lude_economy.py
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('lude_economy.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          tokens=['class LudeNavigator(', 'class LudeAdminPanel(', 'class LudeAdminConfirmation(', 'economy_admin_audit', 'def build_portfolio_embed(', 'def build_market_embed(', 'def build_overview_embed(', '@lude.command(name="panel"', '@admin_group.command(name="historial"', 'ADMIN_OWNER_ID = 1006704642618568735']
          for token in tokens: assert token in source, token
          assert source.count('class LudeEconomy(commands.Cog):')==1
          print('QoL 1.0: compilación, estructura y seguridad básica OK')
          PY
      - name: Publicar exclusivamente Cog validado y retirar workflow temporal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lude_economy.py
          git rm .github/workflows/qol-repair.yml
          git commit -m 'Implementar QoL 1.0: paneles, mercado, cartera, cooldowns y auditoría'
          git push