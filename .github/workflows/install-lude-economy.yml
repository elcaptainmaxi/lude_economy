name: Instalar actualización Lude Economy
on:
  push:
    paths:
      - .github/lude-update-payload.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir Cog y verificar integridad
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, py_compile
          payload = Path('.github/lude-update-payload.txt').read_text(encoding='ascii')
          source = lzma.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(source).hexdigest()
          expected = '4188a4d067921db0312c531096765f686f1b19486d200589bfd66ac6a36903f6'
          if digest != expected:
              raise RuntimeError('El archivo reconstruido no coincide con el checksum previsto')
          Path('lude_economy.py').write_bytes(source)
          py_compile.compile('lude_economy.py', doraise=True)
          print('Integridad y sintaxis OK:', len(source), 'bytes')
          PY
      - name: Publicar Cog y retirar archivos temporales
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lude_economy.py
          git rm .github/lude-update-payload.txt .github/workflows/install-lude-economy.yml
          git commit -m 'Actualizar economía: mercado de 5 minutos y panel admin'
          git push